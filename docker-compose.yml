services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # The delivery worker runs inside this process (WORKER_MODE=inprocess,
    # the default). To run it separately instead, set WORKER_MODE=separate in
    # .env and add a second service with `command: python -m app.worker`.
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
