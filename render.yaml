# Per-engagement Render Blueprint. Before deploying a client copy, replace
# every CLIENT below with the client's slug (e.g. traceflow-acme-api): Render
# service and env-group names are unique per workspace, so two clients with
# the same names would collide.
#
# Default shape: ONE web service. The delivery worker runs inside it
# (WORKER_MODE=inprocess) — the queue is the events table, so nothing is
# lost across restarts. ~$7/mo on Starter.
#
# Plans: `starter` is the floor. Render's free tier spins down after 15
# minutes idle and cold-starts in 30-60s, longer than Shopify's 5-second
# webhook timeout — Shopify would retry, so nothing is lost, but every
# quiet-period order would arrive a minute late.
services:
  - type: web
    name: traceflow-CLIENT-api
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: WORKER_MODE
        value: inprocess
      - fromGroup: traceflow-CLIENT-secrets

  # Higher volume? Set WORKER_MODE=separate above and uncomment ONE of:
  #
  # (a) always-on background worker (~$7/mo): delivery within seconds.
  # - type: worker
  #   name: traceflow-CLIENT-worker
  #   runtime: python
  #   plan: starter
  #   region: oregon
  #   buildCommand: pip install -e .
  #   startCommand: python -m app.worker
  #   envVars:
  #     - key: ENVIRONMENT
  #       value: production
  #     - key: PYTHON_VERSION
  #       value: "3.12"
  #     - fromGroup: traceflow-CLIENT-secrets
  #
  # (b) cron that drains the queue every 5 minutes (~$1/mo): up to 5 minutes
  #     of latency.
  # - type: cron
  #   name: traceflow-CLIENT-worker
  #   runtime: python
  #   schedule: "*/5 * * * *"
  #   buildCommand: pip install -e .
  #   startCommand: python -m app.worker --once
  #   envVars:
  #     - key: ENVIRONMENT
  #       value: production
  #     - key: PYTHON_VERSION
  #       value: "3.12"
  #     - fromGroup: traceflow-CLIENT-secrets

envVarGroups:
  - name: traceflow-CLIENT-secrets
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      # Required. The service refuses to boot without it (fail closed).
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      # Required: monday | hubspot | notion | slack | sheets. Then set that
      # adapter's credentials below; the others can stay unset.
      - key: DESTINATION
        sync: false
      - key: MONDAY_API_KEY
        sync: false
      - key: MONDAY_BOARD_ID
        sync: false
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
      - key: HUBSPOT_OBJECT
        sync: false
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_CHANNEL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_TAB
        sync: false
      # Required. Bearer token for GET /events and POST /events/{id}/replay.
      - key: ADMIN_TOKEN
        sync: false
      # Slack incoming webhook for dead-letter alerts. Strongly recommended.
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Public URL of the web service; used in alert links.
      - key: BASE_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
