services:
  - type: web
    name: sia-kit-api
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - fromGroup: sia-kit-secrets

  # Phase 3d adds the delivery worker here (background worker, or a cron
  # running `python -m app.worker --once` for cheap deployments).

envVarGroups:
  - name: sia-kit-secrets
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      # Required. The service refuses to boot without it (fail closed).
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      # Host allow-list for TrustedHostMiddleware. Leave unset to disable the
      # check; set to e.g. "*.onrender.com" so Render health checks keep working.
      - key: ALLOWED_HOSTS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: BASE_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
