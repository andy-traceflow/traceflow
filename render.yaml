services:
  - type: web
    name: sia-kit-api
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - fromGroup: sia-kit-secrets

  # Delivery worker — reads the events table, transforms, pushes to the
  # destination, retries with backoff. Pick ONE of the two shapes:
  #
  # (a) always-on background worker: lowest delivery latency, second
  #     paid service.
  - type: worker
    name: sia-kit-worker
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -e .
    startCommand: python -m app.worker
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - fromGroup: sia-kit-secrets
  #
  # (b) cron that drains the queue every few minutes: near-free, adds up
  #     to one interval of latency. Delete the worker block above and
  #     uncomment this one.
  # - type: cron
  #   name: sia-kit-worker
  #   runtime: python
  #   schedule: "*/5 * * * *"
  #   buildCommand: pip install -e .
  #   startCommand: python -m app.worker --once
  #   envVars:
  #     - key: ENVIRONMENT
  #       value: production
  #     - key: PYTHON_VERSION
  #       value: "3.12"
  #     - fromGroup: sia-kit-secrets

envVarGroups:
  - name: sia-kit-secrets
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      # Required. The service refuses to boot without it (fail closed).
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      # Required: monday | hubspot | notion | slack | sheets. Then set that
      # adapter's credentials below; the others can stay unset.
      - key: DESTINATION
        sync: false
      - key: MONDAY_API_KEY
        sync: false
      - key: MONDAY_BOARD_ID
        sync: false
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
      - key: HUBSPOT_OBJECT
        sync: false
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_CHANNEL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_TAB
        sync: false
      # Host allow-list for TrustedHostMiddleware. Leave unset to disable the
      # check; set to e.g. "*.onrender.com" so Render health checks keep working.
      - key: ALLOWED_HOSTS
        sync: false
      # Required. Bearer token for GET /events and POST /events/{id}/replay.
      - key: ADMIN_TOKEN
        sync: false
      # Slack incoming webhook for dead-letter alerts. Strongly recommended.
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Public URL of the web service; used in alert links.
      - key: BASE_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
