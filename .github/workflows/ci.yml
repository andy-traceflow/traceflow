name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sia_kit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sia_kit_test
      TRACEFLOW_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/sia_kit_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U postgres && break
            sleep 1
          done

      - name: Apply migrations in order
        run: |
          set -e
          for f in $(ls migrations/*.sql 2>/dev/null | sort); do
            echo "==> applying $f"
            psql -h localhost -U postgres -d sia_kit_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -v
